name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# cancel old runs when new commits are pushed
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .

  test:
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install Mosquitto
        run: |
          sudo apt-get update
          sudo apt-get install -y mosquitto mosquitto-clients

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate certs and identities
        run: python -m broker.setup_identities

      - name: Run tests
        run: python -m pytest -q

      # keep broker logs when a run fails, for debugging
      - name: Upload broker logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: broker-logs-py${{ matrix.python-version }}
          path: /tmp/iotguard-*/broker.log
          if-no-files-found: ignore
