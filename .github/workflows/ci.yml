name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# cancel old runs when new commits are pushed
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .

  test:
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install Mosquitto
        run: |
          sudo apt-get update
          sudo apt-get install -y mosquitto mosquitto-clients
          sudo systemctl stop mosquitto || true
          # tests run brokers from per-trial /tmp workdirs; Ubuntu's packaged
          # AppArmor profile confines mosquitto to /etc/mosquitto, so tear it down
          sudo aa-teardown || true
          sudo apparmor_parser -R /etc/apparmor.d/usr.sbin.mosquitto 2>/dev/null || true
          sudo ln -sf /etc/apparmor.d/usr.sbin.mosquitto /etc/apparmor.d/disable/ 2>/dev/null || true
          D=$(mktemp -d /tmp/iotguard-selfcheck-XXXXXX)
          printf 'listener 18883 127.0.0.1\nallow_anonymous true\n' > "$D/mosquitto.conf"
          mosquitto -c "$D/mosquitto.conf" -v & MPID=$!
          sleep 1
          if ! kill -0 $MPID 2>/dev/null; then
            echo "::error::mosquitto cannot read a /tmp config"
            sudo aa-status 2>&1 | head -20 || true
            sudo dmesg 2>/dev/null | grep -i 'apparmor.*mosquitto' | tail -10 || true
            exit 1
          fi
          kill $MPID

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate certs and identities
        run: python -m broker.setup_identities

      - name: Run tests
        run: python -m pytest -q

      # keep broker logs when a run fails, for debugging
      - name: Upload broker logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: broker-logs-py${{ matrix.python-version }}
          path: /tmp/iotguard-*/broker.log
          if-no-files-found: ignore
